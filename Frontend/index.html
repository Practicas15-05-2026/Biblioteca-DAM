<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header class="main-header">
        <h1>Biblioteca</h1>
    </header>

    <main>
        <div class="btn">
            <button class="btn-user" onclick="window.location.href='usuarios-list.html'">
                Usuarios
            </button>
        </div>
        <div class="btn">
            <button class="btn-new" onclick="window.location.href='registrar-libros.html'">
                Nuevo Libro
            </button>
        </div>
        <div class="dashboard-container">
            <section class="entity-section">
                <div class="card">
                    <h2>Inventario de Libros</h2>
                    <div class="table-wrapper">
                        <table>
                            <tbody id="tablas-libro">
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
