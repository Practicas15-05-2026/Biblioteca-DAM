<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header class="main-header">
        <div style="text-align:right">
            <button class="lang-btn" data-lang="es" onclick="setLang('es')">🇪🇸</button>
            <button class="lang-btn" data-lang="en" onclick="setLang('en')">🇬🇧</button>
        </div>
        <h1 id="header-titulo"></h1>
    </header>

    <main>
        <div class="contenedor-botones">
            <button class="btn-user" id="btn-usuarios" onclick="window.location.href='usuarios-list.html'"></button>
        </div>
        <div class="contenedor-botones">
            <button class="btn-new" id="btn-nuevo-libro" onclick="window.location.href='registrar-libros.html'"></button>
        </div>
        <div class="dashboard-container">
            <section class="entity-section">
                <div class="tarjeta">
                    <h2 id="titulo-inventario"></h2>
                    <div class="table-wrapper">
                        <div id="tablas-libro"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="traducciones.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
    <script>
        document.getElementById('header-titulo').textContent = trad('titulo');
        document.getElementById('btn-usuarios').textContent = trad('usuarios');
        document.getElementById('btn-nuevo-libro').textContent = trad('nuevoLibro');
        document.getElementById('titulo-inventario').textContent = trad('inventario');
        marcarBandera();
    </script>
</body>

</html>
